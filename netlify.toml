[build]
  publish = "public"
  functions = "netlify/functions"
  command = "echo 'No build step needed'"

[functions]
  node_bundler = "esbuild"
  # Keep these as regular node_modules instead of bundling them.
  external_node_modules = ["nodemailer", "pdf-lib", "jszip", "@netlify/blobs"]
  included_files = ["lib/**"]

# Employee form: https://your-site/e/<company-link-name>
[[redirects]]
  from = "/e/*"
  to = "/form.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://awainsurance.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=300"
